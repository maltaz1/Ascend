name: CI — Type Check & Build

on:
  push:
    branches: [main, feat/ts-fix-pwa-onboarding]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (TypeScript)
        run: pnpm check

      - name: Build (Vite)
        run: pnpm build
        env:
          # Variáveis públicas exigidas pelo build; valores vazios são suficientes
          # para a compilação em CI — em produção os valores reais vêm da Vercel.
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
